name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  domain-portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded domain literals outside config
        run: node backend/scripts/check_domain_portability.mjs
      - name: Check for Infrakinetic/CRM import-boundary violations
        run: node backend/scripts/check_no_infrakinetic_imports.mjs

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:test
      - run: npm run lint:scripts
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
