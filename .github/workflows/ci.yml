name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  domain-portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded domain literals outside config
        run: node backend/scripts/check_domain_portability.mjs
      - name: Check for Infrakinetic/CRM import-boundary violations
        run: node backend/scripts/check_no_infrakinetic_imports.mjs
      - name: Check no Cognito secret material reaches frontend/
        run: node backend/scripts/check_no_cognito_secret_in_frontend.mjs
      # Master plan §69.4 — the management signing private key never reaches
      # the browser. The check existed but was never wired into CI (audit
      # remediation L9). Added as a step in this existing job, so the
      # required status-check names are unchanged.
      - name: Check no management signing key material reaches frontend/
        run: node backend/scripts/check_no_signing_key_in_frontend.mjs

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:test
      - run: npm run lint:scripts
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
